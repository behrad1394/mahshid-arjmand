<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO | مهشید ارجمندنیا</title>

<body>
  <style>
.painting-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
    padding: 20px;
}

.painting-img {
    width: 200px;  /* عرض مربع */
    height: 200px; /* ارتفاع مربع */
    object-fit: cover; /* برای اینکه عکس دفرمه نشود و درست داخل کادر بنشیند */
    border: 4px solid #000; /* کادر مشکی دور عکس */
    border-radius: 8px; /* گوشه‌های گرد (اختیاری) */
}

.about-link {
    font-size: 16px;
    font-weight: bold;
    color: #000;
    text-decoration: underline;
}

  <div class="painting-card">
    <!-- خودِ تگ عکس که هم کادر است و هم عکس را نشان می‌دهد -->
    <img src="آدرس_عکس_شما.jpg" alt="نقاشی کودکان" class="painting-img">

    <!-- متن زیر آن -->
    <a href="#" class="about-link">درباره ی این نقاشی</a>
</div>

</body>
</html>
